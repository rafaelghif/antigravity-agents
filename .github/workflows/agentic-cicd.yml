name: Agentic CI/CD (Semantic Release Gates)
on: [pull_request]

jobs:
  agent_review:
    if: github.repository == 'rafaelghif/antigravity-agents'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Environment
        run: |
          pip install pytest
      - name: Trigger Hermes Auto-Pilot Reviewer
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Executing Hermes Manager Review..."
          pytest tests/agent_eval.py
          python3 scripts/auto_reviewer.py
