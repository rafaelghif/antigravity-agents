name: Agentic CI/CD (Semantic Release Gates)
on: [pull_request]

jobs:
  agent_review:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Environment
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.0.0
      - name: Trigger Hermes Auto-Pilot Reviewer
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Executing Hermes Manager Review..."
          pytest tests/test_agent_eval.py
          PYTHONIOENCODING=utf-8 python scripts/auto_reviewer.py
