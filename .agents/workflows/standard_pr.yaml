tasks:
  product-manager:
    command: "python3 scripts/intent_guard.py"
    depends_on: []
  staff-backend:
    command: "python3 scripts/verify.py --execute --terse"
    depends_on: ["product-manager"]
  devsecops-principal:
    command: "python3 scripts/git_hygiene_guard.py --check"
    depends_on: ["staff-backend"]
  qa-automation-lead:
    command: "python3 -m unittest discover tests"
    depends_on: ["staff-backend"]
  scrum-master:
    command: "python3 scripts/inbox_manager.py report"
    depends_on: ["devsecops-principal", "qa-automation-lead"]
