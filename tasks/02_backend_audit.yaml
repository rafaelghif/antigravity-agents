id: "02_backend_audit"
title: "Backend Audit - Hooks and Guards"
description: Deep audit of Python hooks and guards for edge cases that could crash the OS.
tasks:
  - Fix bare excepts (`except:` or `except Exception: pass`) across all hooks and guards. Replace with specific exception catching and stderr logging.
  - Fix malformed `sys.stdin` reads by adding robust JSON error handling and safe string decoding.
  - Fix `subprocess.run` calls by adding explicit `timeout` arguments to prevent hanging processes.
  - Fix file reads on Windows by enforcing `encoding="utf-8"` everywhere.
status: "DONE"
